<script>/* ranim.cjs — Roblox R6/R15 motion engine, 3D previewer and keyframe exporter. One file, no dependencies.
   Node:    node ranim.cjs clip.json [more.json ...] [--out DIR]
            -> pose report on stdout, DIR/<Name>.rbxmx, DIR/<Name>.lua, DIR/storyboard-<Name>.svg (+.png), DIR/preview.html
   Browser: window.RANIM_CLIPS = [spec, ...]; then run this script -> mounts the previewer in #ranim (or <body>). */
(function (G) {
'use strict';

// ============ 1. MATH: vectors [x,y,z], quaternions [x,y,z,w]. Body axes: +X character's right, +Y up, -Z forward ============

const add = (a, b) => [a[0] + b[0], a[1] + b[1], a[2] + b[2]];
const sub = (a, b) => [a[0] - b[0], a[1] - b[1], a[2] - b[2]];
const mul = (a, k) => [a[0] * k, a[1] * k, a[2] * k];
const dot = (a, b) => a[0] * b[0] + a[1] * b[1] + a[2] * b[2];
const cross = (a, b) => [a[1] * b[2] - a[2] * b[1], a[2] * b[0] - a[0] * b[2], a[0] * b[1] - a[1] * b[0]];
const unit = a => mul(a, 1 / (Math.hypot(a[0], a[1], a[2]) || 1));
const qax = (i, deg) => { const q = [0, 0, 0, Math.cos(deg * D2R / 2)]; q[i] = Math.sin(deg * D2R / 2); return q; };
const qmul = (a, b) => [
  a[3] * b[0] + a[0] * b[3] + a[1] * b[2] - a[2] * b[1],
  a[3] * b[1] - a[0] * b[2] + a[1] * b[3] + a[2] * b[0],
  a[3] * b[2] + a[0] * b[1] - a[1] * b[0] + a[2] * b[3],
  a[3] * b[3] - a[0] * b[0] - a[1] * b[1] - a[2] * b[2]];
const qinv = q => [-q[0], -q[1], -q[2], q[3]];
const qrot = (q, v) => { const t = mul(cross(q, v), 2); return add(add(v, mul(t, q[3])), cross(q, t)); };
const qmat = q => { const [x, y, z, w] = q; return [
  1 - 2 * (y * y + z * z), 2 * (x * y - z * w), 2 * (x * z + y * w),
  2 * (x * y + z * w), 1 - 2 * (x * x + z * z), 2 * (y * z - x * w),
  2 * (x * z - y * w), 2 * (y * z + x * w), 1 - 2 * (x * x + y * y)]; };
const qangle = (a, b) => 2 * Math.acos(Math.min(1, Math.abs(a[0] * b[0] + a[1] * b[1] + a[2] * b[2] + a[3] * b[3]))) / D2R;

// ============ 2. RIGS: joint pivots as in Roblox (C0 in parent, C1 in child), part sizes in studs ============
// r0 = rotation baked into C0/C1 (R6 only). Export conjugates by it so authoring is always in body axes.
const part = (parent, c0, c1, size, kind, side, r0) => ({ parent, c0, c1, size, kind, side: side || 0, r0 });
const RIGS = { R15: { name: 'R15', hip: 2, root: 'LowerTorso', parts: {
  LowerTorso: part('HumanoidRootPart', [0, -1, 0], [0, -0.2, 0], [2, 0.4, 1], 'root'),
  UpperTorso: part('LowerTorso', [0, 0.2, 0], [0, -0.8, 0], [2, 1.6, 1], 'spine'),
  Head: part('UpperTorso', [0, 0.8, 0], [0, -0.6, 0], [1.2, 1.2, 1.2], 'spine') } },
R6: { name: 'R6', root: 'Torso', parts: {
  Torso: part('HumanoidRootPart', [0, 0, 0], [0, 0, 0], [2, 2, 1], 'root', 0, [0, H, H, 0]),
  Head: part('Torso', [0, 1, 0], [0, -0.5, 0], [1.2, 1.2, 1.2], 'spine', 0, [0, H, H, 0]) } } };
for (const [S, s] of [['Left', -1], ['Right', 1]]) {
  const P = RIGS.R15.parts, Q = RIGS.R6.parts, ry = [0, s * H, 0, H];

  P[S + 'LowerArm'] = part(S + 'UpperArm', [0, -0.33, 0], [0, 0.26, 0], [0.92, 1.05, 0.92], 'limb', s);
  P[S + 'Hand'] = part(S + 'LowerArm', [0, -0.5, 0], [0, 0.125, 0], [0.86, 0.3, 0.86], 'limb', s);
