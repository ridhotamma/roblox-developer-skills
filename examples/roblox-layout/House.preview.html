<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>House Layout</title>
<style>
:root{--bg:#F3EFE7;--panel:#FFFFFF;--ink:#26231F;--muted:#7B756B;--line:#E4DED3;--accent:#2F7D6D;--err:#D64545;--warn:#DB8F1F;--info:#4F82E6;--chip:#EFEAE0;--shadow:0 6px 24px rgba(40,30,10,.10)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1A1B1F;--panel:#24262B;--ink:#ECE9E2;--muted:#9A968E;--line:#34373D;--accent:#57B8A4;--err:#F06A6A;--warn:#F0AE45;--info:#7AA5F5;--chip:#2E3036;--shadow:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#1A1B1F;--panel:#24262B;--ink:#ECE9E2;--muted:#9A968E;--line:#34373D;--accent:#57B8A4;--err:#F06A6A;--warn:#F0AE45;--info:#7AA5F5;--chip:#2E3036;--shadow:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
#app{display:grid;grid-template-columns:1fr 340px;grid-template-rows:auto 1fr;height:100%}
header{grid-column:1/3;display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0;font-weight:650;letter-spacing:-.01em}
.chip{background:var(--chip);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--chip);border-radius:9px;padding:3px}
.seg button,.tog{border:0;background:transparent;color:var(--ink);font:inherit;padding:5px 12px;border-radius:7px;cursor:pointer}
.seg button.on{background:var(--panel);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:600}
.tog{background:var(--chip);font-size:13px}
.tog.on{background:var(--accent);color:#fff}
.sp{flex:1}
#stage{position:relative;overflow:hidden;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
#plan{display:none;cursor:crosshair}
#over{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-50%);background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;box-shadow:0 1px 5px rgba(0,0,0,.18);white-space:nowrap;opacity:.94}
.lab.poi{background:var(--accent);color:#fff}
.pin{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
.pin.error{background:var(--err)}.pin.warn{background:var(--warn)}.pin.info{background:var(--info)}
.pin.sel{width:20px;height:20px;margin:-10px 0 0 -10px;animation:pulse 1.1s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,69,69,.55)}100%{box-shadow:0 0 0 18px rgba(214,69,69,0)}}
#hint{position:absolute;right:14px;bottom:12px;font-size:12px;color:var(--muted);background:var(--panel);padding:4px 10px;border-radius:8px;opacity:.9}
#tip{position:absolute;display:none;background:var(--ink);color:var(--bg);padding:5px 9px;border-radius:7px;font-size:12px;pointer-events:none;white-space:nowrap;z-index:5}
aside{background:var(--panel);border-left:1px solid var(--line);overflow:auto;padding:16px;min-height:0}
.score{display:flex;align-items:center;gap:14px}
.ring{--v:0;width:68px;height:68px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--v)*1%),var(--chip) 0);display:grid;place-items:center;flex:none}
.ring b{width:52px;height:52px;border-radius:50%;background:var(--panel);display:grid;place-items:center;font-size:20px}
.verdict{font-weight:650;font-size:15px;text-transform:capitalize}
.sub{color:var(--muted);font-size:12.5px}
h2{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px}
.bal{position:relative;height:10px;border-radius:5px;background:linear-gradient(90deg,var(--err),var(--warn) 25%,var(--accent) 50%,var(--warn) 75%,var(--info))}
.bal i{position:absolute;top:-4px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--panel);border:3px solid var(--ink)}
.bal-l{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.stat{background:var(--chip);border-radius:9px;padding:8px 10px}
.stat b{display:block;font-size:17px;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted)}
.curve{display:flex;align-items:flex-end;gap:5px;height:70px;margin-top:4px}
.curve div{flex:1;background:var(--accent);border-radius:4px 4px 0 0;position:relative;min-height:3px}
.curve div span{position:absolute;bottom:-17px;left:0;right:0;text-align:center;font-size:10px;color:var(--muted)}
.issue{display:grid;grid-template-columns:10px 1fr;gap:9px;padding:9px 8px;border-radius:9px;cursor:pointer;border:1px solid transparent}
.issue:hover{background:var(--chip)}.issue.sel{border-color:var(--ink);background:var(--chip)}
.issue i{width:9px;height:9px;border-radius:50%;margin-top:5px}
.issue .m{font-size:13px}.issue .f{font-size:12px;color:var(--muted);margin-top:2px}
.ok{padding:12px;background:var(--chip);border-radius:9px;font-size:13px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted)}
.leg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 56vh 1fr}header{grid-column:1}aside{border-left:0;border-top:1px solid var(--line)}body{overflow:auto}#hint{display:none}}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1 id="title">Layout</h1><span class="chip" id="type"></span><span class="chip" id="dims"></span>
    <span class="sp"></span>
    <span class="seg" id="views"><button data-v="3d" class="on">3D</button><button data-v="plan">Plan</button></span>
    <button class="tog" id="tCut">Cutaway</button><button class="tog" id="tEye">Player view</button>
    <button class="tog on" id="tLab">Labels</button><button class="tog on" id="tIss">Issues</button>
    <button class="tog" id="tHeat">Walk width</button><button class="tog" id="tClr">Clearances</button>
  </header>
  <div id="stage"><canvas id="gl"></canvas><canvas id="plan"></canvas><div id="over"></div><div id="tip"></div><div id="hint"></div></div>
  <aside>
    <div class="score"><div class="ring" id="ring"><b id="score">0</b></div><div><div class="verdict" id="verdict"></div><div class="sub" id="counts"></div></div></div>
    <h2>Spacing balance</h2>
    <div class="bal"><i id="balDot"></i></div><div class="bal-l"><span>too tight</span><span>balanced</span><span>too loose</span></div>
    <h2>Measurements</h2><div class="stats" id="stats"></div>
    <div id="curveBox" style="display:none"><h2>Difficulty by stage</h2><div class="curve" id="curve"></div><div style="height:18px"></div></div>
    <h2>Findings</h2><div id="issues"></div>
    <h2>Plan legend</h2>
    <div class="leg"><span><i style="background:rgba(214,69,69,.55)"></i>too narrow to walk</span><span><i style="background:rgba(224,150,43,.5)"></i>narrow for a main route</span><span><i style="background:rgba(140,90,200,.45)"></i>can't be reached</span><span><i style="border:1.5px dashed var(--info);background:none"></i>empty floor</span><span><i style="border:1.5px dashed var(--accent);background:none"></i>space an object needs</span></div>
  </aside>
</div>

let mouse = null;

// ---------- overlay labels for 3D ----------

// ---------- input ----------
function setView(v) { state.view = v; glc.style.display = v === "3d" ? "block" : "none"; pc.style.display = v === "plan" ? "block" : "none"; document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === v));

const tog = (id, key, fn) => { const b = $(id); b.classList.toggle("on", !!state[key]); b.onclick = () => { state[key] = !state[key]; b.classList.toggle("on", state[key]); if (fn) fn(); dirty = true; }; };
tog("tCut", "cut", () => upload()); tog("tLab", "labels"); tog("tIss", "issues"); tog("tHeat", "heat", () => { if (state.heat) setView("plan"); }); tog("tClr", "clr", () => { if (state.clr) setView("plan"); });
tog("tEye", "eye", () => {
  if (state.eye && D.spawn) { const s = D.spawn, f = D.focus || [CX, 4, CZ]; state.cut = false; $("tCut").classList.remove("on"); Object.assign(cam, { tx: s[0], ty: (s[1] || 0) + 4.5, tz: s[2], dist: 12.5, pitch: 14, yaw: Math.atan2(s[0] - f[0], s[2] - f[2]) * 180 / Math.PI, fov: 70 }); D.spawnRot = cam.yaw; setView("3d"); }
  else { Object.assign(cam, home); state.cut = interior; $("tCut").classList.toggle("on", state.cut); }
  upload();
});
const ptrs = new Map(); let pinch = 0;
