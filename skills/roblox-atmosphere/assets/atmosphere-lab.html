<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atmosphere Lab</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --panel2: #1e222b; --line: #2a2f3a;
    --text: #e6e8ee; --muted: #9aa1b2; --accent: #7cc4ff; --warn: #ffb35c; --ok: #7ee0a1;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #f4f5f8; --panel: #ffffff; --panel2: #f0f2f6; --line: #d9dde5;
      --text: #1a1d24; --muted: #5b6375; --accent: #1f6fd1; --warn: #b5650d; --ok: #1d8a4c;
    }
  }
  :root[data-theme="light"] {
    --bg: #f4f5f8; --panel: #ffffff; --panel2: #f0f2f6; --line: #d9dde5;
    --text: #1a1d24; --muted: #5b6375; --accent: #1f6fd1; --warn: #b5650d; --ok: #1d8a4c;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { padding: 14px 16px 6px; display: flex; gap: 12px; align-items: baseline; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header p { margin: 0; color: var(--muted); font-size: 13px; }
  main { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 14px; padding: 8px 16px 24px; }
  @media (max-width: 900px) { main { grid-template-columns: minmax(0, 1fr); } }
  .stage { min-width: 0; }
  canvas#view { width: 100%; aspect-ratio: 16 / 9; display: block; border-radius: 10px; background: #000; image-rendering: auto; }
  .meta { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin: 8px 2px; }
  .mood { color: var(--muted); max-width: 70ch; }
  .checks { display: flex; gap: 12px; font-size: 12px; flex-wrap: wrap; }
  .checks span.bad { color: var(--warn); } .checks span.good { color: var(--ok); }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .presets { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; cursor: pointer; }
  .chip:hover { border-color: var(--accent); }
  .chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  input[type=search], input[type=text], select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 13px; }
  button.btn { background: var(--panel2); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; font: inherit; font-size: 13px; cursor: pointer; }
  button.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  aside { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; max-height: calc(100vh - 90px); overflow: auto; }
  @media (max-width: 900px) { aside { max-height: none; } }
  details { border-bottom: 1px solid var(--line); padding: 6px 0; }
  details:last-of-type { border-bottom: 0; }
  summary { cursor: pointer; font-weight: 600; padding: 4px 0; display: flex; justify-content: space-between; align-items: center; }
  summary label { font-weight: 400; font-size: 12px; color: var(--muted); }
  .ctl { display: grid; grid-template-columns: 150px minmax(0, 1fr) 52px; gap: 8px; align-items: center; margin: 4px 0; font-size: 12.5px; }
  .ctl span.name { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ctl output { text-align: right; font-variant-numeric: tabular-nums; }
  .ctl input[type=range] { width: 100%; accent-color: var(--accent); }
  .ctl input[type=color] { width: 100%; height: 24px; border: 1px solid var(--line); border-radius: 4px; background: none; padding: 0; }
  .disabled { opacity: .45; pointer-events: none; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg); padding: 8px 14px; border-radius: 8px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  .note { color: var(--muted); font-size: 12px; margin: 6px 0 2px; }
</style>
</head>
<body>
<header>
  <h1>Atmosphere Lab</h1>
  <p>Pick a genre preset, tune Roblox Lighting by eye, copy Luau. The preview is an approximation of the Roblox renderer: judge mood and readability here, final values in Studio.</p>
</header>
<main>
  <section class="stage">
    <canvas id="view" width="480" height="270"></canvas>
    <div class="meta">
      <div class="mood" id="mood"></div>
      <div class="checks" id="checks"></div>
    </div>
    <div class="row">
      <select id="scene" title="Test scene">
        <option value="outdoor">Outdoor</option><option value="street">Street</option><option value="corridor">Corridor</option>
      </select>
      <select id="ground" title="Ground material">
        <option value="grass">Grass</option><option value="sand">Sand</option><option value="snow">Snow</option><option value="stone">Stone</option><option value="seabed">Seabed</option>
      </select>
      <select id="skybox" title="Skybox">
        <option value="default">Default sky</option><option value="starfield">Starfield skybox</option>
      </select>
      <label><input type="checkbox" id="flashlight"> Flashlight</label>
      <label><input type="checkbox" id="flicker"> Flicker</label>
      <label><input type="checkbox" id="reduce"> Reduce flashing</label>
      <label>Tension <input type="range" id="tension" min="0" max="1" step="0.01" value="0" style="width:90px;vertical-align:middle"></label>
    </div>
    <div class="row">
      <input type="text" id="pname" placeholder="preset_name" style="width:170px" spellcheck="false">
      <button class="btn primary" id="copyLuau">Copy Luau entry</button>
      <button class="btn" id="copyCmd">Copy command-bar script</button>
      <button class="btn" id="copyJson">Copy JSON</button>
      <button class="btn" id="reset">Reset</button>
    </div>
    <input type="search" id="filter" placeholder="Filter by genre: horror, obby, sci-fi..." style="width:100%;max-width:360px">
    <div class="presets" id="presets"></div>
  </section>
  <aside id="panel"></aside>
</main>
<div class="toast" id="toast"></div>

// Turns an atmosphere preset (the JSON shape in assets/presets.json) into Luau.
// Shared by presets.cjs (Node) and atmosphere-lab.html (the build copies this file into the
// page between the GEN markers), so the lab's "Copy" buttons and the CLI always agree.
(function (root) {
  "use strict";

  // Section -> the instance it drives. Names match the kit's Atmosphere.luau.
  var SECTIONS = {
    Lighting: { path: "Lighting" },
    Atmosphere: { cls: "Atmosphere", name: "Atmosphere", parent: "Lighting" },
    Grade: { cls: "ColorCorrectionEffect", name: "AtmosphereGrade", parent: "Lighting" },
    Bloom: { cls: "BloomEffect", name: "AtmosphereBloom", parent: "Lighting" },
    SunRays: { cls: "SunRaysEffect", name: "AtmosphereSunRays", parent: "Lighting" },
    DepthOfField: { cls: "DepthOfFieldEffect", name: "AtmosphereDepthOfField", parent: "Lighting" },
    Clouds: { cls: "Clouds", name: "Clouds", parent: "workspace.Terrain" },
    Sky: { cls: "Sky", name: "Sky", parent: "Lighting" },
  };
  var SECTION_ORDER = ["Lighting", "Atmosphere", "Grade", "Bloom", "SunRays", "Clouds", "Sky", "DepthOfField"];
  // What a missing (null) section tweens to: the effect fades out instead of popping.
  var NEUTRAL = {
    Grade: { Brightness: 0, Contrast: 0, Saturation: 0, TintColor: [255, 255, 255] },
    Bloom: { Intensity: 0 },
    SunRays: { Intensity: 0 },
    Clouds: { Cover: 0, Density: 0 },
    DepthOfField: { FarIntensity: 0, NearIntensity: 0 },
  };

  function num(n) {
    var s = String(Math.round(n * 1000) / 1000);
    return s === "-0" ? "0" : s;
  }

  function value(v) {
    if (Array.isArray(v) && v.length === 3 && v.every(function (x) { return typeof x === "number"; })) {
      return "Color3.fromRGB(" + v.map(function (x) { return Math.round(x); }).join(", ") + ")";
    }
    if (Array.isArray(v)) return "{ " + v.map(value).join(", ") + " }";
    if (typeof v === "number") return num(v);
    if (typeof v === "boolean") return v ? "true" : "false";
    if (typeof v === "string") return JSON.stringify(v);
    if (v && typeof v === "object") {
      return "{ " + Object.keys(v).map(function (k) { return k + " = " + value(v[k]); }).join(", ") + " }";
    }
    return "nil";
  }

  // One preset as a Luau table constructor. `indent` is the indent of the closing brace.
  function presetTable(p, indent) {
    indent = indent || "";
    var inner = indent + "\t";
    var lines = ["{"];
    ["Label", "Mood", "Genres", "Technology"].forEach(function (k) {
      if (p[k] != null) lines.push(inner + k + " = " + value(p[k]) + ",");
    });
    SECTION_ORDER.forEach(function (k) {
      if (p[k]) lines.push(inner + k + " = " + value(p[k]) + ",");
    });
    ["Accent", "Weather", "Ambience", "Reverb"].forEach(function (k) {
      if (p[k] != null) lines.push(inner + k + " = " + value(p[k]) + ",");
    });
    lines.push(indent + "}");
    return lines.join("\n");
  }

  function presetEntry(name, p, indent) {
    indent = indent || "\t";
    return indent + name + " = " + presetTable(p, indent) + ",";
  }

  function presetsModule(presets) {
    var out = [
      "--!strict",
      "-- GENERATED from assets/presets.json by scripts/presets.cjs. Edit the JSON (or tune in",
      "-- atmosphere-lab.html and paste the entry here) - every key maps 1:1 to a Roblox property:",
      "--   Lighting     -> Lighting                  Atmosphere   -> Lighting.Atmosphere",
      "--   Grade        -> ColorCorrectionEffect     Bloom/SunRays/DepthOfField -> the effect",
      "--   Clouds       -> Terrain.Clouds            Sky          -> Lighting.Sky (no skybox ids)",
      "-- A missing effect section fades that effect out. Technology is advice only: it can't be",
      "-- changed by scripts at runtime, so set it in Studio (the command-bar script does).",
      "-- Weather/Ambience/Reverb are read by the kit's Weather and Ambience modules.",
      "",
      "export type Preset = {",
      "\tLabel: string,",
      "\tMood: string?,",
      "\tGenres: { string }?,",
      "\tTechnology: string?,",
      "\tLighting: { [string]: any },",
      "\tAtmosphere: { [string]: any }?,",
      "\tGrade: { [string]: any }?,",
      "\tBloom: { [string]: any }?,",
      "\tSunRays: { [string]: any }?,",
      "\tClouds: { [string]: any }?,",
      "\tSky: { [string]: any }?,",
      "\tDepthOfField: { [string]: any }?,",
      "\tAccent: Color3?,",
      "\tWeather: { Type: string, Intensity: number }?,",
      "\tAmbience: string?,",
      "\tReverb: string?,",
      "}",
      "",
      "local Presets: { [string]: Preset } = {",
    ];
    Object.keys(presets).forEach(function (name) {
      out.push(presetEntry(name, presets[name], "\t"));
    });
    out.push("}", "", "return Presets", "");
    return out.join("\n");
  }

  // A Studio command-bar script that applies a preset to the open place in edit mode, using
  // the same instance names as the kit, with one undo waypoint.
  function commandBar(name, p) {
    var L = [];
    L.push("-- Atmosphere preset '" + name + "' (" + (p.Label || name) + "). Paste into Studio's command bar.");
    L.push("local Lighting, CH = game:GetService(\"Lighting\"), game:GetService(\"ChangeHistoryService\")");
    L.push("CH:SetWaypoint(\"Before atmosphere " + name + "\")");
    L.push("local function get(parent, cls, name)");
    L.push("\tlocal i = parent:FindFirstChild(name)");
    L.push("\tif not (i and i:IsA(cls)) then i = parent:FindFirstChildOfClass(cls) end");
    L.push("\tif cls ~= \"Atmosphere\" and cls ~= \"Sky\" and cls ~= \"Clouds\" and i and i.Name ~= name then i = nil end");
    L.push("\tif not i then i = Instance.new(cls); i.Name = name; i.Parent = parent end");
    L.push("\treturn i");
    L.push("end");
    L.push("local function set(i, props) for k, v in props do i[k] = v end end");
    if (p.Technology) {
      L.push("if not pcall(function() Lighting.Technology = Enum.Technology." + p.Technology + " end) then");
      L.push("\twarn(\"Set Lighting.Technology to " + p.Technology + " in the Properties window\")");
      L.push("end");
    }
    SECTION_ORDER.forEach(function (k) {
      var s = SECTIONS[k];
      var props = p[k] || NEUTRAL[k];
      if (!props) return;
      if (k === "Lighting") {
        L.push("set(Lighting, " + value(props) + ")");
      } else {
        L.push("set(get(" + s.parent + ", \"" + s.cls + "\", \"" + s.name + "\"), " + value(props) + ")");
      }
    });
    if (p.Reverb) L.push("game:GetService(\"SoundService\").AmbientReverb = Enum.ReverbType." + p.Reverb);
    L.push("CH:SetWaypoint(\"Atmosphere " + name + "\")");
    L.push("print(\"Applied atmosphere '" + name + "'\")");
    return L.join("\n");
  }

  var api = {
    SECTIONS: SECTIONS,
    SECTION_ORDER: SECTION_ORDER,
    NEUTRAL: NEUTRAL,
    value: value,
    presetTable: presetTable,
    presetEntry: presetEntry,
    presetsModule: presetsModule,
    commandBar: commandBar,
  };
  if (typeof module !== "undefined" && module.exports) module.exports = api;

})(this);
/*GEN:END*/
</script>

function drawStreet(E, opts, t) {

  const floorAlb = mix(g, [0.5, 0.5, 0.5], 0.3);

    if (panel && z0 < 110) {
      const a = project(-1.2, ceil - 0.01, zm + 1.5, camY), b = project(1.2, ceil - 0.01, zm - 1.5, camY);
      const col = fogged(E, scl(E.accent, 1.3 * k + 0.05), zm);
      ctx.fillStyle = css(col); ctx.fillRect(a[0], a[1], b[0] - a[0], Math.max(1, b[1] - a[1]));
      lights.push([(a[0] + b[0]) / 2, b[1], (b[0] - a[0]), k, zm]);
    }
  }
  for (const [x, y, w, k, zm] of lights) E.emissive.push([x, y, w * 0.6 * k]);
  ctx.globalCompositeOperation = "lighter";
  for (const [x, y, w, k, zm] of lights) { const f = 1 - fogAt(E, zm); glowAt(x, y + w * 0.6, w * 1.6, E.accent, 0.12 * k * f); }
  ctx.globalCompositeOperation = "source-over";
  return avatar(E, W / 2 + 18, 16, true);
}

// ---------- weather ----------
let parts = [];
function weatherStep(E, w, t, dt) {
  const type = w ? w.Type : "none", inten = w ? w.Intensity : 0;
  const base = { rain: 220, storm: 380, snow: 140, blizzard: 320, dust: 22, ash: 90, embers: 30, fireflies: 16, spores: 30, bubbles: 40 }[type] || 0;
  const want = Math.round(base * inten);
  while (parts.length < want) parts.push({ x: Math.random() * W, y: Math.random() * H, s: 0.3 + Math.random() * 0.7, p: Math.random() * 7 });
  if (parts.length > want) parts.length = want;
  const litC = (alb) => shade(E, alb, 0.6, E.indoor);
  for (const q of parts) {
    let vx = 0, vy = 0;
    if (type === "rain") { vx = 40; vy = 520; } else if (type === "storm") { vx = 120; vy = 600; }
    else if (type === "snow") { vx = 10 + Math.sin(t + q.p) * 12; vy = 30; } else if (type === "blizzard") { vx = 340; vy = 70; }
    else if (type === "dust") { vx = 14; vy = Math.sin(t * 0.3 + q.p) * 3; } else if (type === "ash") { vx = 6 + Math.sin(t + q.p) * 8; vy = 18; }
    else if (type === "embers") { vx = Math.sin(t * 2 + q.p) * 10; vy = -30; } else if (type === "fireflies") { vx = Math.sin(t * 0.7 + q.p * 3) * 14; vy = Math.cos(t * 0.5 + q.p) * 10; }
    else if (type === "spores") { vx = 4; vy = -6; } else if (type === "bubbles") { vx = Math.sin(t * 3 + q.p) * 6; vy = -40; }
    q.x += vx * q.s * dt; q.y += vy * q.s * dt;
    if (q.y > H + 10) { q.y = -10; q.x = Math.random() * W; } if (q.y < -12) { q.y = H + 8; q.x = Math.random() * W; }
    if (q.x > W + 20) q.x = -20; if (q.x < -20) q.x = W + 20;
    if (type === "rain" || type === "storm" || type === "blizzard") {
      const len = (type === "blizzard" ? 10 : 9) * q.s;
      const n = Math.hypot(vx, vy);
      ctx.strokeStyle = css(mix(litC([0.75, 0.8, 0.88]), [0.6, 0.65, 0.7], 0.3), type === "blizzard" ? 0.55 : 0.3);
      ctx.lineWidth = q.s * (type === "blizzard" ? 1.4 : 0.9);
      ctx.beginPath(); ctx.moveTo(q.x, q.y); ctx.lineTo(q.x - (vx / n) * len, q.y - (vy / n) * len); ctx.stroke();
    } else if (type === "snow" || type === "ash") {
      ctx.fillStyle = css(type === "snow" ? litC([1, 1, 1]) : litC([0.55, 0.54, 0.52]), 0.85);
      ctx.beginPath(); ctx.arc(q.x, q.y, 1.4 * q.s, 0, 7); ctx.fill();
    } else if (type === "dust") {
      glowAt(q.x, q.y, 40 * q.s, scl(E.fog, E.exposure * 1.2), 0.08);
    } else if (type === "bubbles") {
      ctx.strokeStyle = css(litC([0.85, 1, 1]), 0.5); ctx.lineWidth = 0.8;
      ctx.beginPath(); ctx.arc(q.x, q.y, 1.8 * q.s, 0, 7); ctx.stroke();
    } else {
      const col = type === "embers" ? [1, 0.55, 0.2] : type === "fireflies" ? [0.85, 1, 0.45] : [0.8, 1, 0.88];
      const blink = type === "fireflies" ? Math.max(0, Math.sin(t * 2 + q.p * 5)) : 1;
      ctx.fillStyle = css(col, blink); ctx.beginPath(); ctx.arc(q.x, q.y, 1.2 * q.s + 0.3, 0, 7); ctx.fill();
      if (blink > 0.3) E.emissive.push([q.x, q.y, 3 * q.s]);
    }
  }
}

// ---------- post ----------
function bloomPass(p) {
  const B = p.Bloom; if (!B || B.Intensity <= 0) return;
  sctx.clearRect(0, 0, 120, 68);
  sctx.drawImage(scene, 0, 0, 120, 68);
  const id = sctx.getImageData(0, 0, 120, 68), d = id.data;
  const thr = clamp(0.42 + B.Threshold * 0.17, 0.3, 1.05);
  for (let i = 0; i < d.length; i += 4) {
    const l = (0.2126 * d[i] + 0.7152 * d[i + 1] + 0.0722 * d[i + 2]) / 255;
    const k = l > thr ? clamp((l - thr) / (1 - thr + 0.05), 0, 1) : 0;
    d[i] *= k; d[i + 1] *= k; d[i + 2] *= k;
  }
  sctx.putImageData(id, 0, 0);
  const shrink = 1 + B.Size / 8;
  tiny.width = Math.max(4, Math.round(120 / shrink)); tiny.height = Math.max(3, Math.round(68 / shrink));
  tctx.imageSmoothingEnabled = true;
  tctx.drawImage(small, 0, 0, tiny.width, tiny.height);
  ctx.save(); ctx.globalCompositeOperation = "lighter"; ctx.imageSmoothingEnabled = true;
  ctx.globalAlpha = clamp(B.Intensity * 1.3, 0, 1); ctx.drawImage(tiny, 0, 0, W, H);
  ctx.globalAlpha = clamp(B.Intensity * 0.8, 0, 1); ctx.drawImage(small, 0, 0, W, H);
  ctx.restore();
}

function sunRaysPass(E, sceneName) {
  const S = E.p.SunRays; if (!S || S.Intensity <= 0 || sceneName === "corridor") return;
  if (E.elev < -0.05 || (E.p.Sky && E.p.Sky.CelestialBodiesShown === false)) return;
  const s = sunScreen(E), vis = (1 - clamp(E.A.Density * 0.9, 0, 0.9)) * smooth(-0.05, 0.1, E.elev);
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  const R = 60 + S.Spread * 260;
  const g = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, R);
  g.addColorStop(0, css(E.sun, 0.5 * S.Intensity * vis)); g.addColorStop(1, css(E.sun, 0));
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  const r = rng(5);
  for (let i = 0; i < 14; i++) {
    const a = Math.PI * (0.15 + r() * 0.7), w = 0.03 + r() * 0.05;
    ctx.fillStyle = css(E.sun, 0.12 * S.Intensity * vis);
    ctx.beginPath(); ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + Math.cos(a - w) * R * 1.4, s.y + Math.sin(a - w) * R * 1.4);
    ctx.lineTo(s.x + Math.cos(a + w) * R * 1.4, s.y + Math.sin(a + w) * R * 1.4); ctx.fill();
  }
  ctx.restore();
}

function dofPass(p) {
  const D = p.DepthOfField; if (!D || D.FarIntensity <= 0) return;
  dctx.clearRect(0, 0, W, H);
  tiny.width = 96; tiny.height = 54; tctx.drawImage(scene, 0, 0, 96, 54);
  dctx.globalCompositeOperation = "source-over"; dctx.drawImage(tiny, 0, 0, W, H);
  // far = near the horizon: mask with a band centred on it, wider when the focus is close
  const band = clamp(1 - (D.FocusDistance + D.InFocusRadius) / 150, 0.1, 0.9);
  const m = dctx.createLinearGradient(0, 0, 0, H);
  m.addColorStop(0, "rgba(0,0,0,0.6)"); m.addColorStop(0.5 - band * 0.1, "rgba(0,0,0,1)");
  m.addColorStop(0.5 + band * 0.25, "rgba(0,0,0,0)"); m.addColorStop(1, "rgba(0,0,0,0)");
  dctx.globalCompositeOperation = "destination-in"; dctx.fillStyle = m; dctx.fillRect(0, 0, W, H);
  ctx.save(); ctx.globalAlpha = D.FarIntensity; ctx.drawImage(dof, 0, 0); ctx.restore();
}

function gradePass(p, tension, flash, avatarBox) {
  const id = ctx.getImageData(0, 0, W, H), d = id.data;
  const G = p.Grade || { Brightness: 0, Contrast: 0, Saturation: 0, TintColor: [255, 255, 255] };
  const tint = c3(G.TintColor), tz = tension * tension * (3 - 2 * tension);
  const tSat = -0.5 * tz, tCon = 0.15 * tz, tTint = mix([1, 1, 1], [1, 0.8, 0.8], tz);
  const br = G.Brightness + flash, con = 1 + G.Contrast, sat = 1 + G.Saturation;
  let sum = 0, aIn = 0, nIn = 0, aOut = 0, nOut = 0;
  const bx0 = avatarBox.x0 | 0, bx1 = avatarBox.x1 | 0, by0 = avatarBox.y0 | 0, by1 = avatarBox.y1 | 0;
  const ax = (bx0 + bx1) / 2, ay = (by0 + by1) / 2;
  for (let y = 0, i = 0; y < H; y++) {
    const vy = (y - H / 2) / (H / 2);
    for (let x = 0; x < W; x++, i += 4) {
      let r = d[i] / 255 + br, g = d[i + 1] / 255 + br, b = d[i + 2] / 255 + br;
      r = (r - 0.5) * con + 0.5; g = (g - 0.5) * con + 0.5; b = (b - 0.5) * con + 0.5;
      let l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      r = l + (r - l) * sat; g = l + (g - l) * sat; b = l + (b - l) * sat;
      r *= tint[0]; g *= tint[1]; b *= tint[2];
      if (tz > 0) {
        r = (r - 0.5) * (1 + tCon) + 0.5; g = (g - 0.5) * (1 + tCon) + 0.5; b = (b - 0.5) * (1 + tCon) + 0.5;
        l = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        r = (l + (r - l) * (1 + tSat)) * tTint[0]; g = (l + (g - l) * (1 + tSat)) * tTint[1]; b = (l + (b - l) * (1 + tSat)) * tTint[2];
        const vx = (x - W / 2) / (W / 2), v = 1 - tz * 0.8 * clamp((vx * vx + vy * vy) * 0.6, 0, 1);
        r *= v; g *= v; b *= v;
      }
      r = clamp(r, 0, 1); g = clamp(g, 0, 1); b = clamp(b, 0, 1);
      d[i] = r * 255; d[i + 1] = g * 255; d[i + 2] = b * 255;
      const L = 0.2126 * r + 0.7152 * g + 0.0722 * b;
      sum += L;
      if (x >= bx0 && x <= bx1 && y >= by0 && y <= by1) {
        if (Math.abs(x - ax) < (bx1 - bx0) * 0.22) { aIn += L; nIn++; }
      } else if (Math.abs(x - ax) < (bx1 - bx0) * 1.6 && y >= by0 - 6 && y <= by1 + 4) { aOut += L; nOut++; }
    }
  }
  vctx.putImageData(id, 0, 0);
  const lin = (v) => Math.pow(v, 2.2);
  const a = lin(aIn / Math.max(1, nIn)), b2 = lin(aOut / Math.max(1, nOut));
  return { mean: sum / (W * H), contrast: (Math.max(a, b2) + 0.05) / (Math.min(a, b2) + 0.05) };
}

// ---------- frame ----------
let last = performance.now(), flashT = 0, nextFlash = 3, flickSeed = 0;
function flickerFn(opts, t) {
  if (!opts.flicker) return () => 1;
  const gentle = opts.reduce;
  return (i) => {
    if (i % 5 !== 2) return 1;
    const cyc = (t * 0.6 + i) % 4;
    if (cyc > 0.7) return 1;
    const on = Math.floor(t * (gentle ? 2 : 14) + i) % 2 === 0;
    return gentle ? (on ? 1 : 0.6) : (on ? 1 : 0.05);
  };
}

function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  const t = now / 1000;
  const opts = { scene: $("scene").value, ground: $("ground").value, skybox: $("skybox").value, flashlight: $("flashlight").checked, flicker: $("flicker").checked, reduce: $("reduce").checked };
  const E = environment(P, opts);
  E.emissive = []; E.indoor = opts.scene === "corridor";
  E.lampK = 1; E.flick = flickerFn(opts, t);
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = "source-over";
  const box = opts.scene === "street" ? drawStreet(E, opts, t) : opts.scene === "corridor" ? drawCorridor(E, opts, t) : drawOutdoor(E, opts, t);
  // haze glare toward the sun over far geometry
  if (opts.scene !== "corridor" && E.A.Glare > 0 && E.elev > -0.1) {
    const s = sunScreen(E); ctx.save(); ctx.globalCompositeOperation = "lighter";
    glowAt(s.x, Math.max(s.y, HOR - 20), 80 + E.A.Glare * 25, scl(E.sun, E.exposure), clamp(E.A.Glare * 0.06, 0, 0.5)); ctx.restore();
  }
  if (opts.flashlight) {
    ctx.save(); ctx.globalCompositeOperation = "lighter";
    glowAt(W / 2 + 6, H * 0.6, 95, E.accent, 0.22); glowAt(W / 2 + 6, H * 0.6, 35, E.accent, 0.18); ctx.restore();
  }
  weatherStep(E, P.Weather, t, dt);
  dofPass(P);
  sunRaysPass(E, opts.scene);
  bloomPass(P);
  // storm lightning
  let flash = 0;
  if (P.Weather && P.Weather.Type === "storm") {
    nextFlash -= dt;
    if (nextFlash <= 0) { flashT = 0.0001; nextFlash = 5 + Math.random() * 7; }
    if (flashT > 0) {
      flashT += dt;
      const peak = opts.reduce ? 0.08 : 0.4;
      flash = opts.reduce ? peak * Math.max(0, 1 - flashT / 0.6) : peak * (Math.max(0, 1 - flashT / 0.25) + (flashT > 0.12 ? 0.7 * Math.max(0, 1 - (flashT - 0.12) / 0.35) : 0));
      if (flashT > 0.8) flashT = 0;
    }
  }
  const stats = gradePass(P, +$("tension").value, flash, box);
  if (((now / 250) | 0) !== flickSeed) { flickSeed = (now / 250) | 0; showChecks(stats, opts); }
  requestAnimationFrame(frame);
}

function showChecks(s, opts) {
  const c = $("checks"); c.innerHTML = "";
  const add2 = (txt, good, title) => { const el = document.createElement("span"); el.textContent = txt; el.className = good ? "good" : "bad"; el.title = title; c.appendChild(el); };
  add2(`Avatar contrast ${s.contrast.toFixed(1)}:1`, s.contrast >= 1.6, "Luminance contrast between the avatar and what's behind it. Below ~1.6:1 players lose each other (fine on purpose in horror, bad in PvP).");
  add2(`Mean brightness ${(s.mean * 100).toFixed(0)}%`, s.mean >= 0.07, "Below ~7% the scene is unreadable on a phone in daylight unless lights or a flashlight carry it.");
}

// ---------- UI ----------
function clone(o) { return JSON.parse(JSON.stringify(o)); }

function buildPresetChips() {
  const box = $("presets"), f = $("filter").value.trim().toLowerCase();
  box.innerHTML = "";
  for (const [name, p] of Object.entries(PRESETS)) {
    const hay = (name + " " + p.Label + " " + (p.Genres || []).join(" ")).toLowerCase();
    if (f && !hay.includes(f)) continue;
    const b = document.createElement("button");
    b.className = "chip" + (name === currentName ? " on" : ""); b.textContent = p.Label; b.title = (p.Genres || []).join(", ");
    b.onclick = () => load(name); box.appendChild(b);
  }
}

function control(section, prop, spec, obj) {
  const row = document.createElement("div"); row.className = "ctl";
  const name = document.createElement("span"); name.className = "name"; name.textContent = prop; name.title = prop; row.appendChild(name);
  if (spec[0] === "color") {
    const inp = document.createElement("input"); inp.type = "color"; inp.value = hex(obj[prop]);
    const out = document.createElement("output"); out.textContent = obj[prop].join(",");
    out.style.fontSize = "10px";
    inp.oninput = () => { obj[prop] = unhex(inp.value); out.textContent = obj[prop].join(","); };
    row.appendChild(inp); row.appendChild(out);
  } else if (spec[0] === "bool") {
    const inp = document.createElement("input"); inp.type = "checkbox"; inp.checked = obj[prop] !== false;
    inp.onchange = () => { obj[prop] = inp.checked; };
    row.appendChild(inp); row.appendChild(document.createElement("span"));
  } else {
    const [min, max, step] = spec;
    const inp = document.createElement("input"); inp.type = "range"; inp.min = min; inp.max = max; inp.step = step; inp.value = obj[prop] ?? 0;
    const out = document.createElement("output"); out.textContent = (+inp.value).toString();
    inp.oninput = () => { obj[prop] = +inp.value; out.textContent = inp.value; };
    row.appendChild(inp); row.appendChild(out);
  }
  return row;
}

function buildPanel() {
  const panel = $("panel"); panel.innerHTML = "";
  for (const [section, def] of Object.entries(SCHEMA)) {
    const det = document.createElement("details"); det.open = section === "Lighting" || section === "Atmosphere" || section === "Grade";
    const sum = document.createElement("summary"); sum.textContent = def.label || section;
    const body = document.createElement("div");
    if (def.optional) {
      const lab = document.createElement("label"); const cb = document.createElement("input"); cb.type = "checkbox"; cb.checked = !!P[section];
      lab.appendChild(cb); lab.appendChild(document.createTextNode(" on")); lab.onclick = (e) => e.stopPropagation();
      cb.onchange = () => { P[section] = cb.checked ? clone(def.def) : null; buildPanel(); };
      sum.appendChild(lab);
    }
    det.appendChild(sum);
    const obj = P[section] || (def.optional ? null : (P[section] = {}));
    if (obj) for (const [prop, ...spec] of def.props) { if (obj[prop] === undefined && spec[0] !== "bool") obj[prop] = spec[0] === "color" ? [0, 0, 0] : 0; body.appendChild(control(section, prop, spec, obj)); }
    else body.className = "disabled";
    det.appendChild(body); panel.appendChild(det);
  }
  // world + audio
  const det = document.createElement("details"); det.open = true;
  const sum = document.createElement("summary"); sum.textContent = "Weather, accent, audio"; det.appendChild(sum);
  const sel = (label, options, value, onchange) => {
    const row = document.createElement("div"); row.className = "ctl";
    const n = document.createElement("span"); n.className = "name"; n.textContent = label; row.appendChild(n);
    const s = document.createElement("select"); for (const o of options) { const op = document.createElement("option"); op.value = op.textContent = o; s.appendChild(op); }
    s.value = value; s.onchange = () => onchange(s.value); row.appendChild(s); row.appendChild(document.createElement("span")); return row;
  };
  det.appendChild(sel("Weather", WEATHER, P.Weather ? P.Weather.Type : "none", (v) => { P.Weather = v === "none" ? null : { Type: v, Intensity: P.Weather ? P.Weather.Intensity : 0.8 }; buildPanel(); }));
  if (P.Weather) det.appendChild(control("Weather", "Intensity", [0, 2, 0.05], P.Weather));
  if (!P.Accent) P.Accent = [255, 220, 170];
  det.appendChild(control("", "Accent", ["color"], P));
  det.appendChild(sel("Technology", TECH, P.Technology || "Future", (v) => { P.Technology = v; }));
  det.appendChild(sel("Reverb", REVERB, P.Reverb || "NoReverb", (v) => { P.Reverb = v; }));
  const row = document.createElement("div"); row.className = "ctl";
  const n = document.createElement("span"); n.className = "name"; n.textContent = "Ambience"; row.appendChild(n);
  const inp = document.createElement("input"); inp.type = "text"; inp.value = P.Ambience || ""; inp.oninput = () => { P.Ambience = inp.value || null; };
  row.appendChild(inp); row.appendChild(document.createElement("span")); det.appendChild(row);
  const note = document.createElement("p"); note.className = "note";
  note.textContent = "Accent = the colour of practical lights (lamps, torches, neon). The kit tints lights tagged AtmosphereAccent with it. Ambience must match a key in AtmosphereConfig.Ambiences.";
  det.appendChild(note);
  panel.appendChild(det);
}

function applyLabDefaults(name) {
  const d = Object.assign({ scene: "outdoor", ground: "grass", skybox: "default", flashlight: false, flicker: false }, LAB[name] || {});
  $("scene").value = d.scene; $("ground").value = d.ground; $("skybox").value = d.skybox;
  $("flashlight").checked = d.flashlight; $("flicker").checked = d.flicker;
}

function load(name) {
  currentName = name; P = clone(PRESETS[name]); $("pname").value = name;
  $("mood").textContent = P.Mood ? `${P.Label}: ${P.Mood}` : P.Label;
  applyLabDefaults(name); parts = []; buildPanel(); buildPresetChips();
}

function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show"); setTimeout(() => t.classList.remove("show"), 1400); }
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); toast(`Copied ${what}`); }
  catch (e) { const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); toast(`Copied ${what}`); } catch (_) { toast("Copy failed"); } ta.remove(); }
}
function cleanName() { return ($("pname").value.trim().toLowerCase().replace(/[^a-z0-9_]+/g, "_").replace(/^_+|_+$/g, "") || "custom"); }
function cleaned() { const p = clone(P); for (const k of Object.keys(p)) if (p[k] === null) delete p[k]; return p; }

$("copyLuau").onclick = () => copy(LuauGen.presetEntry(cleanName(), cleaned(), "\t"), "Luau entry for AtmospherePresets.luau");
$("copyCmd").onclick = () => copy(LuauGen.commandBar(cleanName(), cleaned()), "command-bar script");
$("copyJson").onclick = () => copy(JSON.stringify({ [cleanName()]: P }, null, 2), "JSON for presets.json");
$("reset").onclick = () => load(currentName);
$("filter").oninput = buildPresetChips;

if (currentName) { load(currentName); requestAnimationFrame(frame); }
else { $("mood").textContent = "No presets embedded: run node scripts/presets.cjs build"; }
</script>
</body>
